<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя подписка</title>
    <meta name="theme-color" content="#06060f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #06060f;
            --bg2: #0d0d1a;
            --card: rgba(15, 15, 35, 0.7);
            --card-hover: rgba(20, 20, 45, 0.8);
            --border: rgba(255, 255, 255, 0.07);
            --border-active: rgba(99, 102, 241, 0.4);
            --text: #f0f0f5;
            --text2: rgba(240, 240, 245, 0.6);
            --text3: rgba(240, 240, 245, 0.35);
            --accent: #6366f1;
            --accent2: #06b6d4;
            --grad: linear-gradient(135deg, #6366f1, #06b6d4);
            --success: #10b981;
            --warn: #f59e0b;
            --danger: #ef4444;
            --r: 14px;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100%;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Aurora bg */
        .bg-fx {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            animation: floatBlob 20s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #6366f1;
            top: -150px;
            right: -100px;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: #06b6d4;
            bottom: -100px;
            left: -80px;
            animation-delay: -7s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: #8b5cf6;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes floatBlob {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -20px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 30px) scale(0.9);
            }

            100% {
                transform: translate(10px, -10px) scale(1.05);
            }
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.03;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* Layout */
        .page {
            position: relative;
            z-index: 2;
            max-width: 440px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 0 20px;
            animation: fadeUp 0.6s ease backwards;
        }

        .header-shield {
            font-size: 3rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));
            }

            50% {
                filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.6));
            }
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-sub {
            font-size: 0.85rem;
            color: var(--text2);
            margin-top: 2px;
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 12px;
            animation: fadeUp 0.6s ease 0.1s backwards;
        }

        .status-pill.active {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .status-pill.expired {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--warn);
        }

        .status-pill.disabled {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-pill.active .status-dot {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }
        }

        /* Cards */
        .card {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 18px;
            margin-bottom: 12px;
            transition: border-color 0.25s ease;
        }

        .card:hover {
            border-color: var(--border-active);
        }

        .card-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text3);
            margin-bottom: 12px;
        }

        /* QR Section */
        .qr-card {
            text-align: center;
            animation: fadeUp 0.6s ease 0.15s backwards;
        }

        .qr-wrap {
            display: inline-block;
            padding: 16px;
            background: white;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 30px rgba(99, 102, 241, 0.15);
        }

        .qr-wrap svg {
            width: 180px;
            height: 180px;
        }

        .qr-hint {
            font-size: 0.75rem;
            color: var(--text3);
        }

        /* Copy button */
        .btn-copy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: var(--r);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
            margin-top: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-copy:active {
            transform: scale(0.97);
        }

        .btn-copy svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-copy.copied {
            background: var(--success);
            transform: scale(0.97);
        }

        /* URL display */
        .url-display {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            color: var(--text2);
            word-break: break-all;
            margin: 8px 0 10px;
            line-height: 1.5;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            animation: fadeUp 0.6s ease 0.2s backwards;
        }

        .stat-box {
            text-align: center;
            padding: 14px 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            backdrop-filter: blur(12px);
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-lbl {
            font-size: 0.65rem;
            color: var(--text3);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Servers list */
        .servers-card {
            animation: fadeUp 0.6s ease 0.25s backwards;
        }

        .server-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            transition: background 0.2s ease;
        }

        .server-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .server-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent2);
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
        }

        .server-name {
            font-size: 0.82rem;
            font-weight: 500;
            flex: 1;
        }

        .server-tpl {
            font-size: 0.6rem;
            color: var(--text3);
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
        }

        /* Expiry */
        .expiry-card {
            animation: fadeUp 0.6s ease 0.3s backwards;
        }

        .expiry-bar-wrap {
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .expiry-bar {
            height: 100%;
            border-radius: 3px;
            background: var(--grad);
            transition: width 0.6s ease;
        }

        .expiry-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }

        .expiry-label {
            font-size: 0.75rem;
            color: var(--text2);
        }

        .expiry-value {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .expiry-value.ok {
            color: var(--success);
        }

        .expiry-value.warn {
            color: var(--warn);
        }

        .expiry-value.bad {
            color: var(--danger);
        }

        /* Support */
        .support-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: var(--r);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
            animation: fadeUp 0.6s ease 0.35s backwards;
        }

        .support-btn:hover {
            border-color: var(--border-active);
            color: var(--text);
        }

        /* Error state */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .error-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .error-desc {
            font-size: 0.85rem;
            color: var(--text2);
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 0;
            animation: fadeUp 0.6s ease 0.4s backwards;
        }

        .footer-text {
            font-size: 0.65rem;
            color: var(--text3);
        }

        .footer-brand {
            font-weight: 700;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* App download buttons */
        .app-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .app-btn:hover {
            border-color: var(--border-active);
            background: var(--card-hover);
            transform: translateY(-1px);
        }

        .app-btn:active {
            transform: scale(0.97);
        }

        /* Steps */
        .steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            color: var(--text2);
        }

        .step-n {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--grad);
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
            border-radius: 50%;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="bg-fx">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="noise"></div>

    <div class="page" id="page">
        <div class="loading" id="loader">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                showError('🔗', 'Нет токена', 'Ссылка недействительна');
                return;
            }

            fetch(`/api/client-sub?token=${token}`)
                .then(r => {
                    if (r.status === 404) throw { code: 'not_found' };
                    if (!r.ok) throw { code: 'error' };
                    return r.json();
                })
                .then(renderSub)
                .catch(e => {
                    if (e.code === 'not_found') showError('🔍', 'Подписка не найдена', 'Проверьте ссылку или обратитесь в поддержку');
                    else showError('⚠️', 'Ошибка', 'Не удалось загрузить подписку');
                });

            function showError(icon, title, desc) {
                document.getElementById('page').innerHTML = `
                <div class="error-state">
                    <div class="error-icon">${icon}</div>
                    <div class="error-title">${title}</div>
                    <div class="error-desc">${desc}</div>
                </div>`;
            }

            function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

            function renderSub(data) {
                document.title = data.name + ' — ' + data.title;

                const statusMap = {
                    active: { text: 'Активна', cls: 'active' },
                    expired: { text: 'Истекла', cls: 'expired' },
                    disabled: { text: 'Отключена', cls: 'disabled' }
                };
                const st = statusMap[data.status] || statusMap.active;

                // Expiry
                let expiryHtml = '';
                if (data.expiresAt) {
                    const now = Date.now();
                    const created = now - 30 * 24 * 60 * 60 * 1000; // approximate
                    const total = data.expiresAt - created;
                    const remaining = data.expiresAt - now;
                    const pct = Math.max(0, Math.min(100, (remaining / total) * 100));
                    const days = Math.ceil(remaining / (24 * 60 * 60 * 1000));
                    const expDate = new Date(data.expiresAt).toLocaleDateString('ru-RU');
                    const cls = days <= 0 ? 'bad' : days <= 7 ? 'warn' : 'ok';

                    expiryHtml = `
                    <div class="card expiry-card">
                        <div class="card-title">📅 Срок действия</div>
                        <div class="expiry-bar-wrap"><div class="expiry-bar" style="width:${pct}%"></div></div>
                        <div class="expiry-info">
                            <span class="expiry-label">до ${expDate}</span>
                            <span class="expiry-value ${cls}">${days > 0 ? days + ' дн.' : 'Истёк'}</span>
                        </div>
                    </div>`;
                }

                // Servers
                const serversHtml = data.servers.map(s => `
                <div class="server-item">
                    <div class="server-dot"></div>
                    <span class="server-name">${esc(s.name)}</span>
                </div>
            `).join('');

                // Support
                const supportHtml = data.supportUrl ? `
                <a href="${esc(data.supportUrl)}" target="_blank" class="support-btn">
                    💬 Поддержка
                </a>` : '';

                const devStr = data.maxDevices > 0 ? `${data.devices}/${data.maxDevices}` : `${data.devices}`;

                document.getElementById('page').innerHTML = `
                <div class="header">
                    <div class="header-shield">🛡</div>
                    <h1>${esc(data.name)}</h1>
                    <div class="header-sub">${esc(data.title)}</div>
                    <div class="status-pill ${st.cls}">
                        <div class="status-dot"></div>
                        ${st.text}
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-val">${data.serverCount}</div>
                        <div class="stat-lbl">Серверов</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val">${devStr}</div>
                        <div class="stat-lbl">Устройств</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val">${data.accessCount}</div>
                        <div class="stat-lbl">Обращений</div>
                    </div>
                </div>

                <div class="card qr-card" style="margin-top:12px">
                    <div class="card-title">📲 Добавить в Happ</div>
                    <div class="qr-wrap" id="qrContainer"></div>
                    <div class="qr-hint">Отсканируйте в приложении Happ</div>
                    <div class="url-display" id="urlDisplay">${esc(data.subUrl)}</div>
                    <button class="btn-copy" id="btnCopy" data-url="${esc(data.subUrl)}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                        Скопировать ссылку
                    </button>
                </div>

                ${expiryHtml}

                <div class="card servers-card">
                    <div class="card-title">🌍 Серверы (${data.serverCount})</div>
                    ${serversHtml || '<div style="color:var(--text3);font-size:0.8rem;text-align:center;padding:12px">Нет серверов</div>'}
                </div>

                ${supportHtml}

                <div class="card apps-card" style="animation:fadeUp 0.6s ease 0.35s backwards">
                    <div class="card-title">📱 Скачать приложение</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                        <a href="https://apps.apple.com/app/happ-vpn/id6504523051" target="_blank" class="app-btn">
                            <span style="font-size:1.3rem">🍎</span>
                            <div><div style="font-weight:600;font-size:0.8rem">Happ</div><div style="font-size:0.6rem;color:var(--text3)">iOS</div></div>
                        </a>
                        <a href="https://apps.apple.com/app/streisand/id6450534064" target="_blank" class="app-btn">
                            <span style="font-size:1.3rem">🍏</span>
                            <div><div style="font-weight:600;font-size:0.8rem">Streisand</div><div style="font-size:0.6rem;color:var(--text3)">iOS</div></div>
                        </a>
                        <a href="https://play.google.com/store/apps/details?id=com.v2ray.ang" target="_blank" class="app-btn">
                            <span style="font-size:1.3rem">🤖</span>
                            <div><div style="font-weight:600;font-size:0.8rem">v2rayNG</div><div style="font-size:0.6rem;color:var(--text3)">Android</div></div>
                        </a>
                        <a href="https://github.com/MatsuriDayo/nekoray/releases" target="_blank" class="app-btn">
                            <span style="font-size:1.3rem">💻</span>
                            <div><div style="font-weight:600;font-size:0.8rem">Nekoray</div><div style="font-size:0.6rem;color:var(--text3)">Windows/Mac</div></div>
                        </a>
                    </div>
                </div>

                <div class="card" style="animation:fadeUp 0.6s ease 0.4s backwards">
                    <div class="card-title">📖 Как подключиться</div>
                    <div class="steps">
                        <div class="step"><span class="step-n">1</span><span>Скачайте приложение выше</span></div>
                        <div class="step"><span class="step-n">2</span><span>Нажмите «Скопировать ссылку» или отсканируйте QR-код</span></div>
                        <div class="step"><span class="step-n">3</span><span>В приложении: Добавить → Из буфера обмена / QR</span></div>
                        <div class="step"><span class="step-n">4</span><span>Включите VPN и пользуйтесь 🚀</span></div>
                    </div>
                </div>

                <div class="footer">
                    <span class="footer-text">Powered by <span class="footer-brand">${esc(data.title)}</span></span>
                </div>
            `;

                // QR
                try {
                    const qr = qrcode(0, 'M'); qr.addData(data.subUrl); qr.make();
                    document.getElementById('qrContainer').innerHTML = qr.createSvgTag({ scalable: true });
                } catch {
                    document.getElementById('qrContainer').innerHTML = '<div style="padding:20px;color:#999;font-size:0.8rem">QR недоступен</div>';
                }

                // Copy
                document.getElementById('btnCopy').addEventListener('click', function () {
                    const url = this.dataset.url;
                    const btn = this;
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(url);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
                        document.body.appendChild(ta); ta.select();
                        try { document.execCommand('copy'); } catch { }
                        document.body.removeChild(ta);
                    }
                    btn.classList.add('copied');
                    btn.innerHTML = '✅ Скопировано!';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Скопировать ссылку';
                    }, 2000);
                });
            }
        })();
    </script>
