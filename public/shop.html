<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>HappVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --bg: #07070f;
            --bg2: #0c0c1a;
            --card: rgba(16, 16, 32, 0.72);
            --card2: rgba(22, 22, 44, 0.6);
            --glass: rgba(255, 255, 255, 0.035);
            --border: rgba(255, 255, 255, 0.06);
            --border2: rgba(255, 255, 255, 0.1);
            --glow: rgba(99, 102, 241, 0.45);
            --glow2: rgba(6, 182, 212, 0.3);
            --t1: #eef0ff;
            --t2: rgba(238, 240, 255, 0.55);
            --t3: rgba(238, 240, 255, 0.28);
            --ac: #6366f1;
            --ac2: #818cf8;
            --cy: #06b6d4;
            --gn: #10b981;
            --rd: #ef4444;
            --am: #f59e0b;
            --gr: linear-gradient(135deg, #6366f1, #06b6d4);
            --safe: env(safe-area-inset-bottom, 0px);
        }

        html {
            font-size: 16px
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--t1);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: calc(82px + var(--safe))
        }

        .aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden
        }

        .ob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .18;
            animation: ob 22s ease-in-out infinite
        }

        .ob1 {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, #6366f1, transparent 70%);
            top: -12%;
            right: -6%
        }

        .ob2 {
            width: 270px;
            height: 270px;
            background: radial-gradient(circle, #06b6d4, transparent 70%);
            bottom: 8%;
            left: -8%;
            animation-delay: -8s
        }

        @keyframes ob {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(20px, -30px) scale(1.1)
            }
        }

        .w {
            position: relative;
            z-index: 1;
            max-width: 460px;
            margin: 0 auto;
            padding: 0 16px
        }

        /* HEADER */
        .hdr {
            text-align: center;
            padding: 18px 0 14px
        }

        .hdr-shield {
            width: 48px;
            height: 48px;
            margin: 0 auto 8px;
            position: relative
        }

        .hdr-shield svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 12px rgba(99, 102, 241, .4))
        }

        .hdr-n {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -.03em;
            background: var(--gr);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .hdr-s {
            font-size: .76rem;
            color: var(--t2);
            margin-top: 2px
        }

        /* NAV */
        .nav {
            position: fixed;
            bottom: 14px;
            left: 10px;
            right: 10px;
            width: auto;
            z-index: 50;
            background: rgba(7, 7, 15, .95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px 2px
        }

        .nav-in {
            display: flex;
            max-width: 460px;
            margin: 0 auto;
            padding: 0 4px
        }

        .nb {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 2px;
            background: 0;
            border: 0;
            color: var(--t3);
            font-family: inherit;
            font-size: .58rem;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
            border-radius: 8px;
            letter-spacing: .02em
        }

        .nb svg {
            width: 20px;
            height: 20px;
            stroke-width: 1.8;
            transition: .2s
        }

        .nb.on {
            color: var(--ac2)
        }

        .nb.on svg {
            filter: drop-shadow(0 0 6px var(--glow))
        }

        .nb:active {
            transform: scale(.9)
        }

        /* PAGES */
        .pg {
            display: none;
            animation: pi .25s ease
        }

        .pg.on {
            display: block
        }

        @keyframes pi {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* CARDS */
        .cd {
            background: var(--card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            transition: .2s
        }

        .cd:hover {
            border-color: var(--border2)
        }

        .cd-glow {
            position: relative;
            overflow: hidden
        }

        .cd-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gr);
            opacity: .7
        }

        .cd-t {
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--t3);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .cd-t svg {
            width: 14px;
            height: 14px;
            opacity: .5
        }

        .cd-v {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.1
        }

        .cd-h {
            font-size: .76rem;
            color: var(--t2);
            margin-top: 4px
        }

        .gt {
            background: var(--gr);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        /* STATS */
        .sts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px
        }

        .st {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: .2s
        }

        .st:hover {
            border-color: var(--border2);
            transform: translateY(-1px)
        }

        .st:active {
            transform: scale(.97)
        }

        .st-i {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px
        }

        .st-i svg {
            width: 16px;
            height: 16px
        }

        .st-v {
            font-size: 1.15rem;
            font-weight: 800
        }

        .st-l {
            font-size: .62rem;
            color: var(--t3);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: .04em;
            font-weight: 600
        }

        /* PROGRESS */
        .pb {
            height: 5px;
            background: rgba(255, 255, 255, .06);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px
        }

        .pb-f {
            height: 100%;
            border-radius: 5px;
            transition: width .8s ease
        }

        .pb-i {
            display: flex;
            justify-content: space-between;
            font-size: .7rem;
            color: var(--t3);
            margin-top: 4px
        }

        /* BADGE */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: .68rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px
        }

        .badge-gn {
            background: rgba(16, 185, 129, .1);
            color: var(--gn);
            border: 1px solid rgba(16, 185, 129, .2)
        }

        .badge-rd {
            background: rgba(239, 68, 68, .1);
            color: var(--rd);
            border: 1px solid rgba(239, 68, 68, .2)
        }

        .badge-am {
            background: rgba(245, 158, 11, .1);
            color: var(--am);
            border: 1px solid rgba(245, 158, 11, .2)
        }

        /* URL BOX */
        .url {
            background: rgba(99, 102, 241, .05);
            border: 1px solid rgba(99, 102, 241, .12);
            border-radius: 10px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: .7rem;
            color: var(--ac2);
            word-break: break-all;
            line-height: 1.5;
            cursor: pointer;
            transition: .2s;
            position: relative
        }

        .url:hover {
            border-color: rgba(99, 102, 241, .35)
        }

        .url.cp {
            border-color: rgba(16, 185, 129, .4);
            background: rgba(16, 185, 129, .06)
        }

        /* BUTTONS */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 12px;
            font-family: inherit;
            font-size: .86rem;
            font-weight: 650;
            cursor: pointer;
            transition: .2s
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn svg {
            width: 18px;
            height: 18px
        }

        .btn-p {
            background: var(--gr);
            color: #fff;
            box-shadow: 0 4px 18px rgba(99, 102, 241, .3)
        }

        .btn-p:hover {
            box-shadow: 0 4px 28px rgba(99, 102, 241, .5)
        }

        .btn-g {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, .25)
        }

        .btn-o {
            background: 0;
            color: var(--t2);
            border: 1px solid var(--border)
        }

        .btn-o:hover {
            border-color: var(--glow);
            color: var(--t1)
        }

        .btn+.btn {
            margin-top: 8px
        }

        .btn-gr {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .btn-gr .btn {
            margin: 0
        }

        /* PLAN CARDS */
        .pl {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            border-image: linear-gradient(to bottom, #6366f1, #06b6d4) 1;
            border-image-slice: 0 0 0 1;
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: .25s;
            overflow: hidden
        }

        .pl::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, .04), transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: .25s
        }

        .pl:hover {
            border-color: var(--glow);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, .12)
        }

        .pl:hover::after {
            opacity: 1
        }

        .pl:active {
            transform: translateY(0) scale(.98)
        }

        .pl.pop {
            border-color: rgba(99, 102, 241, .25);
            background: linear-gradient(135deg, rgba(99, 102, 241, .06), rgba(6, 182, 212, .03));
            box-shadow: 0 0 20px rgba(99, 102, 241, .08)
        }

        .pl.pop::after {
            opacity: 1
        }

        .pl-bg {
            position: absolute;
            top: 0;
            right: 16px;
            background: var(--gr);
            color: #fff;
            font-size: .56rem;
            font-weight: 700;
            padding: 3px 10px 4px;
            border-radius: 0 0 8px 8px;
            letter-spacing: .06em;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(99, 102, 241, .3)
        }

        .pl-n {
            font-size: 1.06rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -.01em
        }

        .pl-d {
            font-size: .78rem;
            color: var(--t2);
            margin-bottom: 12px;
            line-height: 1.4
        }

        .pl-fs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px
        }

        .pl-f {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: .7rem;
            font-weight: 500;
            color: var(--t1);
            background: rgba(99, 102, 241, .08);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, .12)
        }

        .pl-f svg {
            width: 12px;
            height: 12px;
            opacity: .7
        }

        .pl-bot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2px
        }

        .pl-pr {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -.02em
        }

        /* REF */
        .ref-c {
            background: var(--card2);
            border: 1px dashed var(--border2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 10px;
            cursor: pointer;
            transition: .2s
        }

        .ref-c:hover {
            border-color: var(--ac);
            background: rgba(99, 102, 241, .04)
        }

        .ref-v {
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            letter-spacing: .1em;
            color: var(--ac2);
            margin-top: 6px
        }

        .ref-sts {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px
        }

        .ref-st {
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 6px
        }

        .ref-st-v {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 2px
        }

        /* TICKETS */
        .tkt {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: .2s
        }

        .tkt:hover {
            border-color: var(--border2)
        }

        .tkt-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px
        }

        .tkt-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .tkt-dot.op {
            background: var(--gn);
            box-shadow: 0 0 6px rgba(16, 185, 129, .4)
        }

        .tkt-dot.cl {
            background: var(--t3)
        }

        .tkt-sub {
            font-size: .86rem;
            font-weight: 600;
            flex: 1
        }

        .tkt-dt {
            font-size: .66rem;
            color: var(--t3)
        }

        .tkt-pv {
            font-size: .76rem;
            color: var(--t2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        /* CHAT */
        .chat {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding: 4px
        }

        .mg {
            max-width: 82%;
            padding: 10px 13px;
            border-radius: 14px;
            font-size: .84rem;
            line-height: 1.4;
            animation: mi .2s ease
        }

        @keyframes mi {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .mg-u {
            align-self: flex-end;
            background: var(--ac);
            color: #fff;
            border-bottom-right-radius: 4px
        }

        .mg-a {
            align-self: flex-start;
            background: var(--card2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px
        }

        .mg-t {
            font-size: .6rem;
            opacity: .5;
            margin-top: 3px
        }

        .mg-iw {
            display: flex;
            gap: 8px
        }

        .mg-in {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--t1);
            font-family: inherit;
            font-size: .84rem;
            outline: 0;
            resize: none;
            transition: .2s
        }

        .mg-in:focus {
            border-color: var(--glow)
        }

        .mg-in::placeholder {
            color: var(--t3)
        }

        .mg-sb {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--gr);
            border: 0;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: .2s
        }

        .mg-sb:active {
            transform: scale(.88)
        }

        .mg-sb svg {
            width: 18px;
            height: 18px
        }

        /* MODAL */
        .mo {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(8px);
            z-index: 60;
            display: none;
            align-items: flex-end;
            justify-content: center
        }

        .mo.on {
            display: flex
        }

        .mo-s {
            background: var(--bg2);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 460px;
            max-height: 82vh;
            overflow-y: auto;
            padding: 16px 16px calc(16px + var(--safe));
            animation: su .3s ease;
            border-top: 1px solid var(--border2)
        }

        @keyframes su {
            from {
                transform: translateY(100%)
            }

            to {
                transform: translateY(0)
            }
        }

        .mo-h {
            width: 32px;
            height: 3px;
            background: rgba(255, 255, 255, .1);
            border-radius: 3px;
            margin: 0 auto 12px
        }

        .mo-t {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px
        }

        /* SECTION */
        .sec {
            font-size: .88rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .sec svg {
            width: 16px;
            height: 16px;
            opacity: .5
        }

        /* INPUT */
        .inp {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 13px;
            color: var(--t1);
            font-family: inherit;
            font-size: .86rem;
            outline: 0;
            transition: .2s
        }

        .inp:focus {
            border-color: var(--glow)
        }

        .inp::placeholder {
            color: var(--t3)
        }

        .ig {
            margin-bottom: 10px
        }

        .il {
            font-size: .72rem;
            color: var(--t3);
            margin-bottom: 5px;
            font-weight: 600
        }

        /* MISC */
        .emp {
            text-align: center;
            padding: 28px 14px;
            color: var(--t3)
        }

        .emp-i {
            font-size: 2.2rem;
            margin-bottom: 8px;
            opacity: .4
        }

        .emp-t {
            font-size: .88rem;
            font-weight: 600;
            color: var(--t2);
            margin-bottom: 3px
        }

        .emp-d {
            font-size: .76rem
        }

        .ld {
            text-align: center;
            padding: 28px;
            color: var(--t3)
        }

        .sp {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--ac);
            border-radius: 50%;
            animation: ro .7s linear infinite;
            margin: 0 auto 8px
        }

        @keyframes ro {
            to {
                transform: rotate(360deg)
            }
        }

        .toast {
            position: fixed;
            bottom: 86px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gn);
            color: #fff;
            padding: 9px 20px;
            border-radius: 10px;
            font-size: .82rem;
            font-weight: 600;
            z-index: 200;
            opacity: 0;
            transition: .3s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
            pointer-events: none
        }

        .toast.on {
            opacity: 1
        }

        /* Inline SVG sizing */
        .cd-t svg,
        .cd-h svg,
        .sec svg,
        .st-i svg,
        .pl-f svg,
        .emp-i svg,
        .ref-c svg,
        .ref-st svg {
            width: 14px;
            height: 14px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0
        }

        .st-i svg {
            width: 16px;
            height: 16px
        }

        .emp-i svg {
            width: 36px;
            height: 36px;
            opacity: .4
        }

        .cd-h svg {
            width: 13px;
            height: 13px
        }

        ::-webkit-scrollbar {
            width: 3px
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .06);
            border-radius: 3px
        }
    </style>
</head>

<body>
    <div class="aurora">
        <div class="ob ob1"></div>
        <div class="ob ob2"></div>
    </div>
    <div class="w">
        <div class="hdr">
            <div class="hdr-shield"><svg viewBox="0 0 48 48" fill="none">
                    <defs>
                        <linearGradient id="sg" x1="0" y1="0" x2="48" y2="48">
                            <stop stop-color="#6366f1" />
                            <stop offset="1" stop-color="#06b6d4" />
                        </linearGradient>
                    </defs>

            };
            async function api(u) { const r = await fetch(u); if (!r.ok) throw 0; return r.json() }
            async function post(u, b) { const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }); const d = await r.json().catch(() => ({})); if (d.error === 'subscribe_required') { ud.requiredSubscription = d.requiredSubscription; renderRequiredGate(); } return d }
            function toast(m) { const t = $('tst'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2500) }
            function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }
            function fD(d) { if (!d || d <= 0) return '∞'; return { 1: '1 день', 7: '1 нед', 30: '1 мес', 60: '2 мес', 90: '3 мес', 180: '6 мес', 365: '1 год' }[d] || d + ' дн' }
            function fT(g) { if (!g || g <= 0) return '∞'; return g >= 1000 ? (g / 1000 | 0) + ' TB' : g + ' GB' }
            function tL(ts) { if (!ts) return '∞'; const d = ts - Date.now(); if (d <= 0) return 'Истекла'; const dy = d / 864e5 | 0, h = (d % 864e5) / 36e5 | 0; return dy > 0 ? dy + ' дн ' + h + ' ч' : h + ' ч' }
            function cp(t) { navigator.clipboard.writeText(t).then(() => toast('✅ Скопировано')).catch(() => { const i = document.createElement('input'); i.value = t; document.body.appendChild(i); i.select(); document.execCommand('copy'); document.body.removeChild(i); toast('✅ Скопировано') }) }

            function go(p) {

                const list = Array.isArray(cfg.paymentMethods) ? cfg.paymentMethods.filter(m => m && m.enabled !== false) : [];

                return list.map((m, i) => `<label class="cd" style="display:block;cursor:pointer;margin-bottom:8px">

</div></div></label>`).join('');

            function selectedPay() { return document.querySelector('input[name="payM"]:checked')?.value || (payMs()[0]?.name || '') }
            function hasRequiredGate() { return !!(ud.requiredSubscription && ud.requiredSubscription.required) }

                $('hC').innerHTML = `<div class="emp"><div class="emp-i">${I.shield}</div><div class="emp-t">Нужна подписка на канал</div><div class="emp-d">Подпишитесь на все каналы и нажмите проверку.</div></div>

            async function load() {

                }
                catch { $('hC').innerHTML = '<div class="emp"><div class="emp-i">' + I.shield + '</div><div class="emp-t">Ошибка загрузки</div></div>' }
            }

            // HOME
            function rH() {
                const s = ud.activeSub, bal = ud.balance || 0, refs = ud.referralCount || 0, cur = cfg.currency || '₽'; let sh = '';

                    sh = `<div class="cd cd-glow"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div class="cd-t" style="margin:0">${I.shield} Статус</div><span class="badge ${bc}">${bt}</span></div>

                let qty = 1;

                    try {

                        if (r.ok) { cM(); toast('✅ +' + qty + ' устройств!'); ud.balance = r.balance; setTimeout(() => load(), 500) }
                        else { toast('❌ ' + (r.error || 'Ошибка')); $('dvB').disabled = false; $('dvB').innerHTML = I.check + ' Купить' }
                    } catch { toast('❌ Ошибка'); $('dvB').disabled = false; $('dvB').innerHTML = I.check + ' Купить' }
                }
            };

            // Auto-refresh data every 15s (silent, no page reset)
            async function silentRefresh() {
                try {
                    const [s, p, u] = await Promise.all([api('/api/shop/settings'), api('/api/shop/plans'), uid ? api('/api/shop/user-data?userId=' + uid) : {}]);
                    cfg = s; plans = p; ud = u;
                    if (hasRequiredGate()) { renderRequiredGate(); return; }
                    // Re-render current active page
                    const active = document.querySelector('.pg.on');
                    if (active) {
                        const id = active.id.replace('pg-', '');
                        ({ home: rH, sub: rS, bal: rB, ref: rR, help: rP })[id]?.();
                    }
                } catch { }
            }
            setInterval(silentRefresh, 15000);

            // Refresh when user returns to the app
            document.addEventListener('visibilitychange', () => { if (!document.hidden) silentRefresh() });
            if (tg && tg.onEvent) tg.onEvent('activated', silentRefresh);
